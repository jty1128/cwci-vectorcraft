name: CI
'on':
  pull_request:
    branches:
    - cwci-ff26386f38b554c8456e-base
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gate:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@8de85f814fa8b61d63abc062f2c9bc866158a217
    with:
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      timeout-minutes: '90'
      dev-strip: 'true'
      dev-debug: '0'
      test-shards: '5'
      shard-command: cargo xtask ci shard
      warm-command: cargo xtask ci warm
      packages: pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev
        libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev
        mesa-vulkan-drivers libgl1-mesa-dev
