name: Affinity 3 corpus
'on':
  pull_request:
    paths:
    - crates/**
    - xtask/**
    - Cargo.toml
    - Cargo.lock
    - .github/workflows/affinity-corpus.yml
    branches:
    - cwci-ff26386f38b554c8456e-base
permissions:
  contents: read
concurrency:
  group: affinity-corpus-${{ github.ref }}
  cancel-in-progress: 'true'
jobs:
  affinity3:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@8de85f814fa8b61d63abc062f2c9bc866158a217
    with:
      timeout-minutes: '30'
      toolchain: '1.95'
      craft-fonts-ref: ''
      targets: ''
      tools: ''
      dev-debug: '0'
      env: 'AFFINITY_CORPUS_REQUIRED=1

        CARGO_PROFILE_TEST_DEBUG=0

        '
      cache-version: v1-affinity
      command: '# Pinned and checksum-verified corpus.

        cargo xtask corpus --affinity

        # Parse every file and freeze actual Affinity 3 feature retention.

        cargo test -p vectorcraft-affinity --all-features -- --nocapture

        # Every artboard, native save, SVG, PDF and PSD export.

        cargo test -p vectorcraft-engine --test affinity_artboards --test affinity_text
        --test affinity_corpus -- --nocapture

        '
